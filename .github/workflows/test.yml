name: CI Tests

on:
  push:
    branches: [main, 'fase*']
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    name: Integrity & E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'tests/package-lock.json'

      - name: Check JavaScript Syntax
        run: node --check app.js

      - name: Run Data Integrity Tests
        run: node tests/data-test.mjs

      - name: Install Test Dependencies
        run: |
          cd tests
          npm ci
          npx playwright install chromium

      - name: Run E2E Browser Tests
        run: |
          cd tests
          node e2e-test.mjs
          node sync-test.mjs
          node prerender-test.mjs
          node draft5v5-test.mjs

      - name: Verify Prerender & Sitemap Up-to-Date
        run: |
          node scripts/prerender.mjs
          git diff --exit-code hero/ sitemap.xml
